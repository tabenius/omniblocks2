<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Editor Icon Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        svg { width: 24px; height: 24px; stroke-width: 1.5; }
        .icon-card:hover svg { transform: scale(1.1); transition: transform 0.2s; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-8 font-sans">

    <div x-data="iconStore()" class="max-w-5xl mx-auto">
        <header class="mb-12 border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-bold text-white">Block Toolbox Icons</h1>
            <p class="text-slate-400 mt-2">15 cohesive glyphs for Web & Email builders.</p>
        </header>

        <template x-for="(blocks, group) in groups" :key="group">
            <section class="mb-10">
                <h2 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4 px-2" x-text="group"></h2>
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    <template x-for="block in blocks" :key="block.id">
                        <div 
                            @click="copySvg(block.svg)"
                            class="icon-card group flex items-center gap-4 p-3 rounded-lg bg-[#1e293b] border border-slate-800 hover:border-blue-500 hover:bg-[#253347] cursor-pointer transition-all"
                        >
                            <div class="text-blue-400 group-hover:text-blue-300" x-html="block.svg"></div>
                            <div>
                                <div class="text-sm font-medium text-slate-200" x-text="block.name"></div>
                                <div class="text-[10px] text-slate-500 uppercase font-mono" x-text="block.id"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </section>
        </template>
    </div>

    <script>
        function iconStore() {
            return {
                copySvg(svg) {
                    navigator.clipboard.writeText(svg);
                    alert("SVG Code Copied to Clipboard!");
                },
                groups: {
                    "Inline": [
                        { id: "H1", name: "Heading 1", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6V18M13 6V18M6 12H13M16 8L17.5 6.5V18" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "H2", name: "Heading 2", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 6V18M11 6V18M5 12H11M15.5 12C15.5 11 16 10 17 9.5C18 9 19 9.5 19 11C19 12 18.5 12.5 17.5 13.5L15 16V18H19.5" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "H3", name: "Heading 3", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 6V18M11 6V18M5 12H11M15 10C15 8.5 16 7.5 17.5 7.5C19 7.5 20 8.5 20 10C20 11 19 12 18 12.5M18 12.5C19 13 20 14 20 15.5C20 17 19 18 17.5 18C16 18 15 17 15 15.5" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Paragraph", name: "Paragraph", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6H20M4 10H20M4 14H14M4 18H14" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "AlterParagraph", name: "Alter Paragraph", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6H20M10 10H20M4 14H14M10 18H20" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Author", name: "Author", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 11C14.2091 11 16 9.20914 16 7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7C8 9.20914 9.79086 11 12 11ZM6 21V19C6 16.7909 7.79086 15 10 15H14C16.2091 15 18 16.7909 18 19V21" stroke-linecap="round" stroke-linejoin="round"/></svg>` }
                    ],
                    "Media": [
                        { id: "Image", name: "Image", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15L16 10L5 21" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Diagram", name: "Diagram", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="16" width="6" height="5" rx="1" /><rect x="15" y="16" width="6" height="5" rx="1" /><rect x="9" y="3" width="6" height="5" rx="1" /><path d="M12 8V12M12 12H6V16M12 12H18V16" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Audio", name: "Audio", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 5L6 9H2V15H6L11 19V5Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.54 8.46002C16.4774 9.39764 17.0039 10.6692 17.0039 12C17.0039 13.3309 16.4774 14.6024 15.54 15.54M19.07 4.93005C20.9447 6.80528 21.9979 9.34863 21.9979 12C21.9979 14.6514 20.9447 17.1948 19.07 19.07" stroke-linecap="round" stroke-linejoin="round"/></svg>` }
                    ],
                    "Containers": [
                        { id: "Text", name: "Text Box", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7V4H20V7M12 4V20M8 20H16" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Quote", name: "Quote", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 7C8 9 7 11 5 13M13 7C13 9 12 11 10 13M16 7H21V17H16V7ZM5 17H13" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Hero", name: "Hero", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M7 8H13M7 12H17M7 16H11" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "PrimaryBox", name: "Primary Box", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9H21M9 3V9" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Container", name: "Empty Container", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/></svg>` },
                        { id: "Asset", name: "Asset", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12V6C21 4.89543 20.1046 4 19 4H5C3.89543 4 3 4.89543 3 6V18C3 19.1046 3.89543 20 5 20H12M3 10H21M9 4V10M17 14L15 16L17 18M19 16H15" stroke-linecap="round" stroke-linejoin="round"/></svg>` }
                    ],
                    "Layout": [
                        { id: "Layout", name: "Layout (2 col)", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M12 3V21" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
                        { id: "Masonry", name: "Masonry (3 col)", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M9 3V21M15 3V21M3 10H9M9 14H15M15 8H21" stroke-linecap="round" stroke-linejoin="round"/></svg>` }
                    ]
                }
            }
        }
    </script>
</body>
</html>
